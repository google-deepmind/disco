# Single-run baseline configuration: Recipe Translation Length Discovery Baselines
#
# Usage:
#   python -m disco.baselines.eval_discovery_baselines \
#     --config=configs/recipes_baselines.yaml
#
# Any flag can be overridden on the command line, e.g.:
#   python -m disco.baselines.eval_discovery_baselines \
#     --config=configs/recipes_baselines.yaml \
#     --baseline_method=red_team --budget=300
#
# Keys that are not flags name `BaselineRunSettings` or `VerifierConfig`
# fields, which can only be set here.

experiment_name: "recipes_baselines"
output_dir: "./outputs/recipes_baselines"

task_suite: "recipes"
task_name: "all"
baseline_method: "all"

target_model: "gemini-3.8-flash"
# Investigator, T2I judge and every verifier role not set explicitly.
backbone_model: "gemini-3.8-flash"

budget: 900
max_predictions: 10

# Stage 2 out-of-sample precision verification
run_precision_check: true
num_queries: 100
alpha: 0.05
single_batch_null_prob: 0.10
