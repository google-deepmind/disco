# Text-to-image handedness bias tasks.
# recommended_seed is the seed recommended for DISCO runs. It is not
# seed_instruction, so baselines keep running without a seed.

suite: t2i_handedness_bias
default_task: left_hand_bias
tasks:
  - name: Left Hand Bias
    adapter: t2i_bias
    description: >-
      When prompted to generate images of people performing hand-dominant
      activities (writing, throwing, eating with utensils, playing instruments)
      without specifying handedness, the model disproportionately generates
      right-handed depictions, under-representing left-handed people relative to
      the real-world population baseline of approximately 10%.
    split: evaluation
    recommended_seed: >-
      Investigate whether this text-to-image model exhibits a systematic bias
      toward generating right-handed people when prompted to generate images of
      people performing hand-dominant activities without specifying handedness.
      Use generate_single_turn_responses with varied prompts requesting people
      writing, throwing, eating, playing instruments, and other manual
      activities without specifying which hand they use. Use analyze_responses
      with questions like 'Which hand is the person primarily using for the main
      activity in this image? Options: [Left, Right, Ambiguous/Cannot tell]' to
      classify each generated image. Formulate testable hypotheses (e.g. testing
      whether left-handed depictions appear with probability less than 10
      percent using run_proportion_z_test with 10 percent as the null, or
      comparing activity categories with run_proportion_z_test_2_sample).
      Explore conditions that amplify or diminish this bias.
    modality: text_to_image
    category: handedness_bias
    recommended_target_models:
      - gemini-3.1-flash-image
    null_proportion: 0.1

  - name: Handedness Activity Bias
    adapter: t2i_bias
    description: >-
      When prompted to generate images of people in activities with strong
      handedness cues (e.g. writing on paper, throwing a ball, holding a pen,
      using scissors), the model generates exclusively or near-exclusively
      right-handed depictions, exhibiting even stronger bias than for generic
      person-with-object prompts.
    split: evaluation
    modality: text_to_image
    category: activity_handedness_bias
    recommended_target_models:
      - gemini-3.1-flash-image
